  <meta name="description" content="Canonical product, evidence, safety, architecture, UX, and acceptance contract for CUTLINE.">

<body>
  <cutline-spec></cutline-spec>
  <script id="cutline-spec-xml" type="application/xml">
<CUTLINEWinningProductSpec version="1.0" date="2026-07-31" status="approved-for-local-implementation">
  <CanonicalArtifact>
    <Path>docs/CUTLINE_Winning_Product_Spec_2026_07_31.html</Path>
    <Purpose>Define the complete but deliberately narrow CUTLINE product contract for the Agentic Cinema Grafana track.</Purpose>
    <Boundary>This contract does not guarantee a competition result and does not authorize cloud deployment or spend.</Boundary>
  </CanonicalArtifact>
  <Product>
    <Name>CUTLINE</Name>
    <Category>Release assurance for agentic cinema</Category>
    <Operator>Maya Chen, post-production supervisor</Operator>
    <Thesis>Convert live Grafana evidence into shot-level deadline exposure, an allowlisted human-approved recovery, and fresh proof that a delivery crossed back ahead of the release cutline.</Thesis>
    <Journey>Detect, explain, quantify, approve, execute, verify.</Journey>
  </Product>
  <Scenario synthetic="true">
    <Production>Eclipse Protocol — Episode 6</Production>
    <Sequence>SQ-42</Sequence>
    <Shots total="18" atRisk="12"/>
    <Backlog unit="frames">4800</Backlog>
    <Deadline unit="minutes">24</Deadline>
    <Before throughput="120" completionMinutes="40" varianceMinutes="-16"/>
    <Policy deadlineMinimum="200" safeTarget="240" headroomPercent="20"/>
    <After throughput="320" completionMinutes="15" varianceMinutes="9"/>
    <Recovery scenarioCostUSD="18" concurrencyBefore="3" concurrencyAfter="1" reserveBefore="0" reserveAfter="4"/>
  </Scenario>
  <EvidenceBoundary>
    <Disclosure>Controlled synthetic render workload; real emitted telemetry; real Grafana ingestion and MCP retrieval; real Google Cloud action; scenario-mode production, deadline, and cost assumptions.</Disclosure>
    <MustBeReal>Hosted app, runtime MCP calls, telemetry, Google AI invocation, human approval, action request, receipt, configuration transition, annotation, post-action evidence, and provenance.</MustBeReal>
    <MayBeSynthetic>Studio, operator, title, sequence, shots, workload content, injected failure, deadline, worker price, and business impact assumptions.</MayBeSynthetic>
  </EvidenceBoundary>
  <UserExperience>
    <Screen name="Release Command">Production identity, sequence, countdown, 18-shot manifest, projected path, vertical cutline, connection state, and disclosure.</Screen>
    <Screen name="Evidence">Active alert, metrics, Loki logs, Tempo trace, timestamps, run identity, source IDs, and freshness.</Screen>
    <Screen name="Diagnosis">Supported hypothesis, strongest alternative, discriminator, falsifier, and missing evidence.</Screen>
    <Screen name="Impact">Visible formulas, 200 deadline minimum, 240 safe target, 16-minute miss, and affected delivery package.</Screen>
    <Screen name="Approval">Allowlisted plan, exact parameters, blast radius, scenario cost, rollback, approve, and reject.</Screen>
    <Screen name="Execution">Approval ID, action ID, Cloud Run receipt, configuration transition, and Grafana annotation.</Screen>
    <Screen name="Verification">Fresh evidence, throughput and stability gates, cutline crossing, incident state, and unresolved conditions.</Screen>
    <Screen name="Audit">Evidence packet, impact assessment, proposal, approval, receipt, verification, and scenario disclosures.</Screen>
  </UserExperience>
  <Architecture>
    <Layer name="UI">Server-rendered accessible release command surface with progressive enhancement and no chat dependency.</Layer>
    <Layer name="API">FastAPI routes for scenario state, reset, investigation, approval, rejection, execution, verification, and audit.</Layer>
    <Layer name="Domain">Typed immutable records, deterministic calculations, state machine, policy gates, freshness rules, and idempotency.</Layer>
    <Layer name="Agent">Google ADK and Gemini synthesize bounded evidence into a hypothesis and select only versioned recovery templates.</Layer>
    <Layer name="Evidence">Official Grafana MCP in live mode; explicitly labeled deterministic adapter in local tests only.</Layer>
    <Layer name="Action">Allowlisted Cloud Run control operation in live mode; deterministic local executor in tests only.</Layer>
  </Architecture>
  <StateMachine>
    <State>READY</State><State>INVESTIGATING</State><State>AWAITING_APPROVAL</State>
    <State>REJECTED</State><State>EXECUTING</State><State>VERIFYING</State>
    <State>VERIFIED</State><State>BLOCKED</State><State>FAILED</State><State>UNVERIFIED</State>
    <Rule>No state transition trusts client-supplied state.</Rule>
    <Rule>No execution without a current approval.</Rule>
    <Rule>No verified state without fresh post-action evidence from the active run.</Rule>
  </StateMachine>
  <Security>
    <Rule>No credentials in repository, browser bundle, logs, screenshots, or evidence exports.</Rule>
    <Rule>Live mode fails closed when Grafana MCP or Google credentials are missing.</Rule>
    <Rule>Mutation requests require same-origin protection, active-run binding, approval binding, expiry, and idempotency.</Rule>
    <Rule>All operator-provided and tool-provided text is rendered as text, never trusted HTML.</Rule>
  </Security>
  <Testing>
    <Gate>Every tracker story has automated or concrete manual evidence.</Gate>
    <Gate>Deterministic application modules reach 100 percent statement and branch coverage.</Gate>
    <Gate>Browser tests cover success, rejection, duplicate action, stale evidence, MCP failure, action failure, and verification failure.</Gate>
    <Gate>Accessibility and responsive tests cover keyboard use, landmarks, labels, contrast, reduced motion, and mobile layout.</Gate>
    <Gate>Agent behavior is evaluated with Google agents-cli eval rather than brittle pytest assertions on prose.</Gate>
  </Testing>
  <AcceptanceCriteria>
    <Requirement>The first viewport identifies production, sequence, deadline, shots at risk, projected variance, and evidence mode.</Requirement>
    <Requirement>All arithmetic reproduces exactly from visible inputs.</Requirement>
    <Requirement>Every decision links to evidence IDs or deterministic derivations.</Requirement>
    <Requirement>The memorable reveal moves projected completion from sixteen minutes late to nine minutes early only after fresh verification.</Requirement>
    <Requirement>The local journey runs five consecutive times and resets to a clean run identity.</Requirement>
    <Requirement>Real mode contains no non-Google model or alternate AI fallback.</Requirement>
  </AcceptanceCriteria>
  <ExplicitCuts>
    <Cut>Movie generation, script generation, character generation, and music generation.</Cut>
    <Cut>General chatbot, multiple incidents, arbitrary remediation, multi-studio dashboard, and autonomous action.</Cut>
    <Cut>Customer ROI claims, diagnostic accuracy claims, and production-validation claims.</Cut>
    <Cut>Cloud deployment before local verification and explicit approval.</Cut>
  </ExplicitCuts>
  <SourceDigest>
    <Source sha256="99dc48aa839fa93b6b006a16ec0fdeade696870b03126940fe757af7709ff0a1">Prior StrategiX Agentic Cinema winning-strategy research</Source>
    <Source sha256="1e4670293720bf82e76ed1090723a7db8d83fa6dfbb8b2717ecb549ebd740dc3">Prior StrategiX CUTLINE three-minute demo scenario</Source>
    <Source>Official Google agents-cli 0.3.0 ADK scaffold</Source>
  </SourceDigest>
</CUTLINEWinningProductSpec>
  </script>
  <script type="module">
    import{LitElement,html,css}from'https://unpkg.com/lit@3/index.js?module';
    const pillars=[
      ['01','Release-native','Shots, frame ranges, package lock, and the cutline dominate the product.'],
      ['02','Evidence-native','Every state transition cites current Grafana MCP evidence or deterministic derivation.'],
      ['03','Governed','One allowlisted recovery requires a bound human approval.'],
      ['04','Verifiable','Success requires later active-run evidence above the 240 frames/min safe target.']
    ];
    const flow=['Detect','Explain','Quantify','Approve','Execute','Verify'];
    const gates=[
      ['Deadline math','4,800 ÷ 24 = 200 minimum; 200 × 1.20 = 240 safe target.'],
      ['Before','4,800 ÷ 120 = 40 minutes; 24 − 40 = 16 minutes late.'],
      ['After','4,800 ÷ 320 = 15 minutes; 24 − 15 = 9 minutes early.'],
      ['Truth boundary','Synthetic production assumptions; real runtime evidence and action in submitted mode.']
    ];
    class CutlineSpec extends LitElement{
      static styles=css`
        :host{--bg:#08090b;--panel:#111419;--line:#28303a;--text:#f8fafc;--muted:#9ca8b7;--red:#ff5364;--orange:#ff7a3d;--green:#57e3a2;display:block;background:radial-gradient(circle at 80% 0,rgba(255,83,100,.15),transparent 30rem),var(--bg);color:var(--text);min-height:100vh}
        *{box-sizing:border-box}.shell{max-width:1180px;margin:auto;padding:28px 24px 72px}.top{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:20px}.mark{background:var(--red);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900}.brand{font-weight:900;letter-spacing:.12em}.status{margin-left:auto;color:var(--green);border:1px solid rgba(87,227,162,.4);padding:6px 10px;border-radius:999px;font-size:11px}.hero{padding:72px 0 36px;display:grid;grid-template-columns:1.5fr .7fr;gap:24px;align-items:end}.eyebrow{color:var(--orange);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:900}h1{font-size:clamp(48px,8vw,92px);line-height:.9;letter-spacing:-.065em;margin:8px 0 20px}.lede{font-size:20px;color:#d9e0e8;max-width:800px}.clock{border:1px solid rgba(255,83,100,.4);background:rgba(255,83,100,.1);border-radius:24px;padding:24px}.clock strong{font-size:42px;display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,details{background:rgba(17,20,25,.94);border:1px solid var(--line);border-radius:18px;padding:20px}.card h3{margin:5px 0 8px}.card p{color:var(--muted);margin:0;font-size:14px}section{margin:52px 0}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:16px}.head h2{font-size:34px;margin:4px 0}.head p{max-width:540px;color:var(--muted)}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.step{border-top:3px solid var(--orange);background:var(--panel);padding:18px;border-radius:0 0 14px 14px;font-weight:800}.truth{border:1px solid rgba(87,227,162,.4);background:rgba(87,227,162,.07);border-radius:24px;padding:26px}.truth strong{color:var(--green)}details{padding:0}summary{padding:16px;cursor:pointer;font-weight:800}pre{white-space:pre-wrap;max-height:420px;overflow:auto;padding:0 18px 18px;color:#b9f6d6;font-size:11px}.footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;display:flex;justify-content:space-between}
        @media(max-width:850px){.hero,.grid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.shell{padding:20px 14px 48px}.status{display:none}.flow{grid-template-columns:1fr}}
      `;
      render(){const xml=document.getElementById('cutline-spec-xml')?.textContent.trim()??'';return html`
        <main class="shell">
          <header class="top"><div class="mark">C</div><div><div class="brand">CUTLINE</div><div class="eyebrow">Winning product specification</div></div><div class="status">Approved for local implementation</div></header>
          <section class="hero"><div><div class="eyebrow">Agentic Cinema • Grafana track</div><h1>Release assurance<br>for agentic cinema.</h1><p class="lede">Live Grafana evidence becomes shot-level deadline exposure, one human-approved recovery, and fresh proof that SQ-42 crossed back ahead of package lock.</p></div><aside class="clock"><div class="eyebrow">Scenario clock</div><strong>24:00</strong><span>SQ-42 • 18 final shots • 12 at risk</span></aside></section>
          <section><div class="grid">${pillars.map(([n,t,b])=>html`<article class="card"><div class="eyebrow">${n}</div><h3>${t}</h3><p>${b}</p></article>`)}</div></section>
          <section><div class="head"><div><div class="eyebrow">Single operator journey</div><h2>One loop, completely proven</h2></div><p>Agent personas stay behind the product. Maya experiences one coherent decision surface.</p></div><div class="flow">${flow.map(x=>html`<div class="step">${x}</div>`)}</div></section>
          <section><div class="head"><div><div class="eyebrow">Deterministic contract</div><h2>Every number is reproducible</h2></div></div><div class="grid">${gates.map(([t,b])=>html`<article class="card"><h3>${t}</h3><p>${b}</p></article>`)}</div></section>
          <section class="truth"><div class="eyebrow">Evidence boundary</div><h2>Controlled workload. Real proof.</h2><p><strong>Submitted live mode:</strong> real emitted telemetry, real Grafana ingestion and MCP retrieval, real Google AI invocation, real Cloud Run action, and real post-action verification. Production names, assets, deadline, and cost remain explicitly synthetic.</p></section>
          <details><summary>Machine / LLM contract — embedded XML</summary><pre>${xml}</pre></details>
          <footer class="footer"><span>CUTLINE canonical product contract • 2026-07-31</span><span>No deployment or spend authorization</span></footer>
        </main>`}
    }customElements.define('cutline-spec',CutlineSpec);
  </script>
